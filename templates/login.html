<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - Qwin Chess Academy</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-logo">♛</div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Sign in to your academy account
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <div class="password-wrapper">
    <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="toggle-password"
        onclick="togglePassword()"
    >👁️</button>
</div>
            <p class="forgot-password">
    <a href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>
</p>
            <button type="submit">
                Sign In
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('create_account') }}">
                Create Account
            </a>
        </p>

        <a href="{{ url_for('home') }}" class="back-home">
            ← Back to Home
        </a>

    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
