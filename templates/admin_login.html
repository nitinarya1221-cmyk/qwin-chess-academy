<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Qwin Chess Academy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-box {
            width: 400px;
            padding: 40px;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            color: #e5b93f;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e5b93f;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e5b93f;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0c94f;
        }

        .error-message {
            background: #3a2020;
            color: #ff7777;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: #e5b93f;
        }
        /* Password eye icon */
.password-wrapper {
    position: relative;
    width: 100%;
}

.password-wrapper input {
    width: 100%;
    box-sizing: border-box;
    padding-right: 50px;
}

.password-wrapper .toggle-password {
    position: absolute !important;
    right: 12px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;

    width: 32px !important;
    height: 32px !important;

    padding: 0 !important;
    margin: 0 !important;

    background: transparent !important;
    border: none !important;

    color: #777 !important;
    font-size: 18px !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    cursor: pointer;
}

.password-wrapper .toggle-password:hover {
    background: transparent !important;
    color: #000 !important;
}
    </style>

</head>

<body>

    <div class="admin-box">

        <div class="logo">♛</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Qwin Chess Academy
        </p>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="error-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                required
            >

            <div class="password-wrapper">
    <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="toggle-password"
        onclick="togglePassword()"
    >👁️</button>
</div>

            <button type="submit">
                Login as Admin
            </button>

        </form>


        <a href="{{ url_for('home') }}" class="back">
            ← Back to Website
        </a>

    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
